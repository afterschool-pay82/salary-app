<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>급여지급대장 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif; background: #eef1f5; margin: 0; padding: 20px; color: #333; }
    .main-wrapper { max-width: 1760px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    
    .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .title-area { display: flex; align-items: center; gap: 12px; }
    .title-area h1 { margin: 0; font-size: 22px; font-weight: 800; color: #1f1f1f; }
    .month-select { font-size: 14px; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-weight: 600; outline: none; }
    
    /* 2단 액션 바 */
    .action-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .action-bar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .school-filter { padding: 6px 12px; font-size: 13px; border: 1px solid #d9d9d9; border-radius: 4px; min-width: 110px; outline: none; }
    
    .search-input { width: 140px; height: 34px; padding: 0 10px; border: 1.5px solid #adc6ff; border-radius: 4px; font-size: 13px; outline: none; }
    .search-input:focus { border-color: #2f54eb; }

    .btn { padding: 7px 14px; font-size: 13px; font-weight: 600; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-search { background: #2f54eb; color: #fff; border-color: #2f54eb; font-weight: bold; }
    .btn-search:hover { background: #1d39c4; }
    .btn-reset { background: #f5f5f5; color: #555; }
    .btn-reset:hover { background: #e8e8e8; }
    .btn-primary { background: #1890ff; color: #fff; border-color: #1890ff; font-weight: bold; }
    .btn-primary:hover { background: #096dd9; }
    .btn-recalc { background: #722ed1; color: #fff; border-color: #722ed1; font-weight: bold; }
    .btn-recalc:hover { background: #531dab; }
    .btn-tax { background: #13c2c2; color: #fff; border-color: #13c2c2; font-weight: bold; }
    .btn-tax:hover { background: #08979c; }
    .btn-setting { background: #52c41a; color: #fff; border-color: #52c41a; font-weight: bold; }
    .btn-setting:hover { background: #389e0d; }
    .btn-publish { background: #fa8c16; color: #fff; border-color: #fa8c16; font-weight: bold; }
    .btn-publish:hover { background: #d46b08; }
    
    /* 상단 요약 바 */
    .summary-text { 
      font-size: 13.5px; 
      color: #555; 
      margin-bottom: 12px; 
      font-weight: 600; 
      background: #fafafa;
      border: 1px solid #f0f0f0;
      padding: 9px 16px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .summary-text strong.total-gross { color: #1f1f1f; font-weight: 800; }
    .summary-text strong.total-tax { color: #cf1322; }
    .summary-text strong.total-net { color: #1890ff; font-weight: 800; font-size: 14.5px; }
    .divider { color: #e8e8e8; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    th { background: #fafafa; color: #262626; font-weight: 600; border: 1px solid #e8e8e8; padding: 9px 4px; }
    td { border: 1px solid #e8e8e8; padding: 7px 4px; color: #434343; }
    .money-col { text-align: right; padding-right: 8px; font-family: -apple-system, sans-serif; }
    .highlight-blue { color: #1890ff; font-weight: bold; }
    .name-link { font-weight: bold; cursor: pointer; color: #1890ff; text-decoration: underline; }
    
    .badge-cat { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .cat-방과후 { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
    .cat-맞춤형 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
    .cat-코디 { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .cat-안전관리자 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
    .cat-돌봄전담사 { background: #fff0f6; color: #eb2f96; border: 1px solid #ffadd2; }

    .btn-del { border: 1px solid #ffa39e; background: #fff1f0; color: #f5222d; padding: 4px 9px; font-size: 11px; border-radius: 3px; cursor: pointer; font-weight: bold; }

    /* 모달 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; width: 960px; border-radius: 8px; padding: 24px 28px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); max-height: 94vh; overflow-y: auto; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #f0f0f0; padding-bottom: 12px; }
    .close-icon { font-size: 20px; cursor: pointer; border: none; background: none; color: #999; }
    
    .type-selector-bar { display: flex; align-items: center; gap: 16px; background: #f0f5ff; padding: 10px 14px; border-radius: 6px; border: 1px solid #adc6ff; margin-bottom: 14px; font-size: 13px; font-weight: bold; flex-wrap: wrap; }
    .type-selector-bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: #1d39c4; }

    .row-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 20px; row-gap: 12px; margin-bottom: 14px; }
    .input-item { display: flex; align-items: center; justify-content: space-between; }
    .input-item label { font-size: 13px; color: #333; width: 110px; flex-shrink: 0; }
    .input-item input, .input-item select { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; outline: none; }
    
    .bank-box { background: #f9f0ff; padding: 12px 16px; border-radius: 6px; border: 1px solid #d3adf7; margin-bottom: 14px; }
    .bank-title { font-size: 12.5px; font-weight: bold; color: #722ed1; margin-bottom: 8px; }

    .grid-wrap { background: #fafafa; padding: 14px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 14px; }
    .grid-4w { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid-8w { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 12px; row-gap: 8px; }
    .grid-12w { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 12px; row-gap: 8px; }
    .cell-item { display: flex; align-items: center; gap: 6px; }
    .cell-item label { font-size: 12px; color: #444; width: 72px; flex-shrink: 0; font-weight: 600; }
    .cell-item input { width: 100%; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; text-align: right; }

    .modal-bottom { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #eee; padding-top: 14px; }
    .btn-modal-cancel { background: #fff; border: 1px solid #d9d9d9; color: #333; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-modal-save { background: #2f54eb; border: 1px solid #2f54eb; color: #fff; padding: 8px 24px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }

    .setting-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    .setting-table th { background: #f0f2f5; padding: 10px; border: 1px solid #d9d9d9; }
    .setting-table td { padding: 10px; border: 1px solid #d9d9d9; text-align: center; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="top-header">
    <div class="title-area">
      <h1>급여지급대장</h1>
      <input type="month" id="activeMonth" class="month-select" value="2026-08" onchange="renderTable()">
    </div>
  </div>

  <div class="action-container">
    <!-- 1열: 색상 있는 기능 버튼 -->
    <div class="action-bar-row">
      <button class="btn btn-primary" onclick="openRecordModal()">정산 등록 (방과후/맞춤형/코디/안전/돌봄)</button>
      <button class="btn btn-recalc" onclick="recalculateAllData(true)">⚡ 전체 데이터 일괄 재계산</button>
      <button class="btn btn-tax" onclick="exportTaxCombinedCSV()">📊 세무신고용 강사별 합산 CSV</button>
      <button class="btn btn-setting" onclick="openSchoolSettingModal()">학교별 회차 설정</button>
      <button class="btn btn-publish" onclick="exportDataJs()">📢 명세서 데이터 발행 (data.js 저장)</button>
    </div>

    <!-- 2열: 검색/필터 및 흰색 기본 버튼 -->
    <div class="action-bar-row">
      <select id="schoolFilter" class="school-filter" onchange="renderTable()"></select>
      <input type="text" id="teacherSearchInput" class="search-input" placeholder="강사명 검색" onkeyup="if(event.key==='Enter') searchTeacher();">
      <button class="btn btn-search" onclick="searchTeacher()">조회</button>
      <button class="btn btn-reset" onclick="resetTeacherSearch()">전체보기</button>
      <button class="btn" onclick="addNewSchoolPrompt()">+ 학교 등록</button>
      <button class="btn" onclick="exportCSV()">학교별 대장 CSV 저장</button>
    </div>
  </div>

  <!-- 합계 요약 바 (지급계, 소득세, 주민세, 특고료, 산재, 실지급액) -->
  <div class="summary-text" id="summaryCounter">
    <span>전체 0건</span>
    <span class="divider">|</span>
    <span>총 지급계 <strong class="total-gross">₩0</strong></span>
    <span class="divider">|</span>
    <span>소득세계 <strong class="total-tax" id="sumIncomeTax">₩0</strong></span>
    <span class="divider">|</span>
    <span>주민세계 <strong class="total-tax" id="sumLocalTax">₩0</strong></span>
    <span class="divider">|</span>
    <span>특고료계 <strong class="total-tax" id="sumSpecialTax">₩0</strong></span>
    <span class="divider">|</span>
    <span>산재보험계 <strong class="total-tax" id="sumIndAccTax">₩0</strong></span>
    <span class="divider">|</span>
    <span>총 실지급액 <strong class="total-net" id="sumNetPay">₩0</strong></span>
  </div>

  <table>
    <thead>
      <tr>
        <th rowspan="2">근무처</th>
        <th rowspan="2">구분</th>
        <th rowspan="2">과목명(역할)</th>
        <th rowspan="2">강사/인력명</th>
        <th rowspan="2">주민등록번호</th>
        <th rowspan="2">은행</th>
        <th rowspan="2">계좌번호</th>
        <th rowspan="2">재료비</th>
        <th rowspan="2">수업차시(일수)</th>
        <th rowspan="2">지급계</th>
        <th rowspan="2">경비율제외<br>(19.3% 공제)</th>
        <th rowspan="2">특고료</th>
        <th rowspan="2">산재<br>보험료</th>
        <th colspan="2">공제액</th>
        <th rowspan="2">실지급액</th>
        <th rowspan="2">관리</th>
      </tr>
      <tr>
        <th>소득세</th>
        <th>주민세</th>
      </tr>
    </thead>
    <tbody id="payrollTbody"></tbody>
  </table>
</div>

<!-- 학교별 과목 설정 모달 -->
<div class="modal-overlay" id="settingModal">
  <div class="modal-content" style="width: 700px;">
    <div class="modal-top">
      <h2>학교별 회차 세분화 과목 설정</h2>
      <button class="close-icon" onclick="closeSettingModal()">&times;</button>
    </div>
    <div>
      <label style="font-size: 13px; font-weight: bold;">설정할 학교 선택 (가나다순):</label>
      <select id="settingSchoolSelect" onchange="loadSchoolSettings()" style="width: 100%; height: 34px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-weight: bold; margin-top: 6px;"></select>
    </div>
    <table class="setting-table">
      <thead>
        <tr><th>과목명</th><th>일반 (4회)</th><th>8회 세분화</th><th>12회 세분화</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>피아노</strong></td><td><input type="radio" name="set_piano" value="4"></td><td><input type="radio" name="set_piano" value="8"></td><td><input type="radio" name="set_piano" value="12" checked></td></tr>
        <tr><td><strong>피아노2</strong></td><td><input type="radio" name="set_piano2" value="4"></td><td><input type="radio" name="set_piano2" value="8"></td><td><input type="radio" name="set_piano2" value="12" checked></td></tr>
        <tr><td><strong>영어</strong></td><td><input type="radio" name="set_english" value="4"></td><td><input type="radio" name="set_english" value="8" checked></td><td><input type="radio" name="set_english" value="12"></td></tr>
        <tr><td><strong>영어2</strong></td><td><input type="radio" name="set_english2" value="4"></td><td><input type="radio" name="set_english2" value="8"></td><td><input type="radio" name="set_english2" value="12" checked></td></tr>
        <tr><td><strong>수학</strong></td><td><input type="radio" name="set_math" value="4"></td><td><input type="radio" name="set_math" value="8" checked></td><td><input type="radio" name="set_math" value="12"></td></tr>
        <tr><td><strong>컴퓨터1</strong></td><td><input type="radio" name="set_computer1" value="4" checked></td><td><input type="radio" name="set_computer1" value="8"></td><td><input type="radio" name="set_computer1" value="12"></td></tr>
        <tr><td><strong>컴퓨터2</strong></td><td><input type="radio" name="set_computer2" value="4"></td><td><input type="radio" name="set_computer2" value="8" checked></td><td><input type="radio" name="set_computer2" value="12"></td></tr>
      </tbody>
    </table>
    <div class="modal-bottom">
      <button class="btn-modal-cancel" onclick="closeSettingModal()">닫기</button>
      <button class="btn-modal-save" onclick="saveSchoolSettings()">설정 저장</button>
    </div>
  </div>
</div>

<!-- 정산 등록 및 수정 모달 -->
<div class="modal-overlay" id="recordModal">
  <div class="modal-content">
    <div class="modal-top">
      <h2 id="modalTitle">정산 내역 등록</h2>
      <button class="close-icon" onclick="closeRecordModal()">&times;</button>
    </div>

    <!-- 구분 선택 -->
    <div class="type-selector-bar">
      <span>구분 선택:</span>
      <label><input type="radio" name="calcCategory" value="방과후" checked onchange="onChangeCategory()"> 방과후프로그램</label>
      <label><input type="radio" name="calcCategory" value="맞춤형" onchange="onChangeCategory()"> 맞춤형프로그램</label>
      <label><input type="radio" name="calcCategory" value="코디" onchange="onChangeCategory()"> 코디</label>
      <label><input type="radio" name="calcCategory" value="안전관리자" onchange="onChangeCategory()"> 안전관리자</label>
      <label><input type="radio" name="calcCategory" value="돌봄전담사" onchange="onChangeCategory()"> 돌봄전담사</label>
    </div>

    <div class="row-grid-3">
      <div class="input-item">
        <label>학교 선택</label>
        <select id="modalSchool" onchange="onChangeCategory()"></select>
      </div>
      <div class="input-item">
        <label>지급월 선택</label>
        <input type="month" id="modalMonth" value="2026-08">
      </div>
      <div class="input-item">
        <label style="font-weight:bold; color:#1d39c4;">주민등록번호</label>
        <input type="text" id="rrn" placeholder="13자리 (예: 000000-0000000)" maxlength="14" oninput="formatRRN(this)">
      </div>
    </div>

    <div class="row-grid-3">
      <div class="input-item">
        <label id="subjectLabel">과목명</label>
        <input type="text" id="subject" value="축구교실" onkeyup="onChangeCategory()">
      </div>
      <div class="input-item">
        <label id="nameLabel">강사명</label>
        <input type="text" id="name" value="조은이">
      </div>
      <div class="input-item">
        <label id="rateLabel" style="font-weight:bold; color:#2f54eb;">기준 수수료</label>
        <input type="number" id="baseRate" value="26000" style="font-weight:bold;">
      </div>
    </div>

    <!-- 계좌 정보 섹션 -->
    <div class="bank-box">
      <div class="bank-title">💳 급여 입금 계좌 정보</div>
      <div class="row-grid-3" style="margin-bottom:0;">
        <div class="input-item">
          <label>은행명</label>
          <input type="text" id="bankName" list="bankList" placeholder="선택 또는 직접입력" onchange="onBankChange()">
          <datalist id="bankList">
            <option value="국민은행" data-code="004">004</option>
            <option value="신한은행" data-code="088">088</option>
            <option value="우리은행" data-code="020">020</option>
            <option value="하나은행" data-code="081">081</option>
            <option value="농협은행" data-code="011">011</option>
            <option value="지역농축협" data-code="012">012</option>
            <option value="기업은행" data-code="003">003</option>
            <option value="카카오뱅크" data-code="090">090</option>
            <option value="토스뱅크" data-code="092">092</option>
            <option value="케이뱅크" data-code="089">089</option>
            <option value="SC제일은행" data-code="023">023</option>
            <option value="씨티은행" data-code="027">027</option>
            <option value="우체국" data-code="071">071</option>
            <option value="새마을금고" data-code="045">045</option>
            <option value="신협" data-code="048">048</option>
            <option value="수협은행" data-code="007">007</option>
            <option value="부산은행" data-code="032">032</option>
            <option value="대구은행" data-code="031">031</option>
            <option value="경남은행" data-code="039">039</option>
            <option value="광주은행" data-code="034">034</option>
            <option value="전북은행" data-code="035">035</option>
          </datalist>
        </div>
        <div class="input-item">
          <label>은행코드</label>
          <input type="text" id="bankCode" placeholder="예: 004">
        </div>
        <div class="input-item">
          <label>계좌번호</label>
          <input type="text" id="accountNumber" placeholder="'-' 없이 숫자만 입력">
        </div>
      </div>
    </div>

    <div id="modeStatusBadge" style="font-size:12px; font-weight:bold; margin-bottom:8px; color:#1890ff;"></div>

    <div id="boxGeneral4" class="grid-wrap">
      <div class="grid-4w">
        <div class="cell-item"><label>4회(완강)</label><input type="number" id="w4" value="27" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>3회</label><input type="number" id="w3" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>2회</label><input type="number" id="w2" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>1회</label><input type="number" id="w1" placeholder="0" oninput="updateAutoLessons()"></div>
      </div>
    </div>

    <div id="boxDetailed8" class="grid-wrap" style="display:none;">
      <div class="grid-8w">
        <div class="cell-item"><label>8회(완강)</label><input type="number" id="e8" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>7회</label><input type="number" id="e7" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>6회</label><input type="number" id="e6" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>5회</label><input type="number" id="e5" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>4회</label><input type="number" id="e4" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>3회</label><input type="number" id="e3" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>2회</label><input type="number" id="e2" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>1회</label><input type="number" id="e1" placeholder="0" oninput="updateAutoLessons()"></div>
      </div>
    </div>

    <div id="boxDetailed12" class="grid-wrap" style="display:none;">
      <div class="grid-12w">
        <div class="cell-item"><label>12회(완강)</label><input type="number" id="c12" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>11회</label><input type="number" id="c11" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>10회</label><input type="number" id="c10" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>9회</label><input type="number" id="c9" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>8회</label><input type="number" id="c8" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>7회</label><input type="number" id="c7" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>6회</label><input type="number" id="c6" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>5회</label><input type="number" id="c5" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>4회</label><input type="number" id="c4" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>3회</label><input type="number" id="c3" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>2회</label><input type="number" id="c2" placeholder="0" oninput="updateAutoLessons()"></div>
        <div class="cell-item"><label>1회</label><input type="number" id="c1" placeholder="0" oninput="updateAutoLessons()"></div>
      </div>
    </div>

    <div class="row-grid-3">
      <div class="input-item"><label>재료비 지원금</label><input type="number" id="material" placeholder="0"></div>
      <div class="input-item"><label id="lessonsLabel">수업차시(표시용)</label><input type="text" id="displayLessons" value="4"></div>
      <div class="input-item"><label>비고</label><input type="text" id="note" placeholder="특이사항"></div>
    </div>

    <div class="modal-bottom">
      <button class="btn-modal-cancel" onclick="closeRecordModal()">취소</button>
      <button class="btn-modal-save" id="btnSaveRecord" onclick="saveRecordFromModal()">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'afterschool_master_data_v5';
  const SCHOOL_KEY = 'afterschool_master_schools_v5';
  const SETTING_KEY = 'afterschool_school_subjects_setting_v5';

  const bankCodeMap = {
    '국민은행': '004', '신한은행': '088', '우리은행': '020', '하나은행': '081',
    '농협은행': '011', '지역농축협': '012', '기업은행': '003', '카카오뱅크': '090',
    '토스뱅크': '092', '케이뱅크': '089', 'SC제일은행': '023', '씨티은행': '027',
    '우체국': '071', '새마을금고': '045', '신협': '048', '수협은행': '007',
    '부산은행': '032', '대구은행': '031', '경남은행': '039', '광주은행': '034', '전북은행': '035'
  };

  let currentEditId = null;
  let currentSearchQuery = '';

  const defaultSchoolSettings = {
    '창영초': { '피아노': '12', '피아노2': '12', '영어': '8', '영어2': '12', '수학': '12', '컴퓨터1': '4', '컴퓨터2': '8' },
    '청량초': { '피아노': '12', '피아노2': '12', '영어': '8', '영어2': '12', '수학': '8', '컴퓨터1': '4', '컴퓨터2': '8' },
    '온동네돌봄센터': { '피아노': '4', '피아노2': '4', '영어': '4', '영어2': '4', '수학': '4', '컴퓨터1': '4', '컴퓨터2': '4' }
  };

  window.onload = function() {
    if (!localStorage.getItem(STORAGE_KEY)) localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
    if (!localStorage.getItem(SCHOOL_KEY)) {
      localStorage.setItem(SCHOOL_KEY, JSON.stringify(['창영초', '청량초', '온동네돌봄센터']));
    } else {
      const curSchools = JSON.parse(localStorage.getItem(SCHOOL_KEY)) || [];
      if (!curSchools.includes('온동네돌봄센터')) {
        curSchools.push('온동네돌봄센터');
        localStorage.setItem(SCHOOL_KEY, JSON.stringify(curSchools));
      }
    }
    if (!localStorage.getItem(SETTING_KEY)) localStorage.setItem(SETTING_KEY, JSON.stringify(defaultSchoolSettings));
    
    initSchoolDropdowns();
    recalculateAllData(false);
  };

  function searchTeacher() {
    currentSearchQuery = document.getElementById('teacherSearchInput').value.trim();
    renderTable();
  }

  function resetTeacherSearch() {
    currentSearchQuery = '';
    document.getElementById('teacherSearchInput').value = '';
    renderTable();
  }

  function formatRRN(el) {
    let v = el.value.replace(/[^0-9]/g, '');
    if (v.length > 6) {
      el.value = v.slice(0, 6) + '-' + v.slice(6, 13);
    } else {
      el.value = v;
    }
  }

  function onBankChange() {
    const bName = document.getElementById('bankName').value.trim();
    if (bankCodeMap[bName]) {
      document.getElementById('bankCode').value = bankCodeMap[bName];
    }
  }

  function getRecords() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  
  function getSchools() { 
    const schools = JSON.parse(localStorage.getItem(SCHOOL_KEY)) || ['창영초', '청량초', '온동네돌봄센터'];
    return schools.sort((a, b) => a.localeCompare(b, 'ko'));
  }
  
  function getSettings() { return JSON.parse(localStorage.getItem(SETTING_KEY)) || {}; }

  function initSchoolDropdowns() {
    const schools = getSchools();
    const sf = document.getElementById('schoolFilter');
    const ms = document.getElementById('modalSchool');
    const ss = document.getElementById('settingSchoolSelect');

    const curSf = sf.value || '전체';
    sf.innerHTML = '<option value="전체">전체 학교</option>' + schools.map(s => `<option value="${s}">${s}</option>`).join('');
    sf.value = curSf;
    ms.innerHTML = schools.map(s => `<option value="${s}">${s}</option>`).join('');
    ss.innerHTML = schools.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  function addNewSchoolPrompt() {
    const s = prompt('새로운 학교명을 입력하세요:');
    if (!s || !s.trim()) return;
    const schools = getSchools();
    if (schools.includes(s.trim())) return alert('이미 존재하는 학교입니다.');
    schools.push(s.trim());
    schools.sort((a, b) => a.localeCompare(b, 'ko'));
    localStorage.setItem(SCHOOL_KEY, JSON.stringify(schools));
    
    const settings = getSettings();
    settings[s.trim()] = { '피아노': '12', '피아노2': '12', '영어': '8', '영어2': '12', '수학': '8', '컴퓨터1': '4', '컴퓨터2': '8' };
    localStorage.setItem(SETTING_KEY, JSON.stringify(settings));

    initSchoolDropdowns();
    alert(`[${s.trim()}] 학교가 등록되었습니다.`);
  }

  function openSchoolSettingModal() {
    initSchoolDropdowns();
    loadSchoolSettings();
    document.getElementById('settingModal').style.display = 'flex';
  }

  function closeSettingModal() {
    document.getElementById('settingModal').style.display = 'none';
  }

  function loadSchoolSettings() {
    const targetSchool = document.getElementById('settingSchoolSelect').value;
    const settings = getSettings();
    const map = settings[targetSchool] || { '피아노': '12', '피아노2': '12', '영어': '8', '영어2': '12', '수학': '8', '컴퓨터1': '4', '컴퓨터2': '8' };

    setRadioVal('set_piano', map['피아노'] || '12');
    setRadioVal('set_piano2', map['피아노2'] || '12');
    setRadioVal('set_english', map['영어'] || '8');
    setRadioVal('set_english2', map['영어2'] || '12');
    setRadioVal('set_math', map['수학'] || '8');
    setRadioVal('set_computer1', map['컴퓨터1'] || '4');
    setRadioVal('set_computer2', map['컴퓨터2'] || '8');
  }

  function setRadioVal(name, val) {
    const r = document.querySelector(`input[name="${name}"][value="${val}"]`);
    if (r) r.checked = true;
  }

  function getRadioVal(name) {
    const r = document.querySelector(`input[name="${name}"]:checked`);
    return r ? r.value : '4';
  }

  function saveSchoolSettings() {
    const targetSchool = document.getElementById('settingSchoolSelect').value;
    const settings = getSettings();
    settings[targetSchool] = {
      '피아노': getRadioVal('set_piano'),
      '피아노2': getRadioVal('set_piano2'),
      '영어': getRadioVal('set_english'),
      '영어2': getRadioVal('set_english2'),
      '수학': getRadioVal('set_math'),
      '컴퓨터1': getRadioVal('set_computer1'),
      '컴퓨터2': getRadioVal('set_computer2')
    };
    localStorage.setItem(SETTING_KEY, JSON.stringify(settings));
    alert(`[${targetSchool}] 설정이 저장되었습니다.`);
    closeSettingModal();
  }

  function clearAllCountInputs() {
    for (let i = 1; i <= 4; i++) { const el = document.getElementById(`w${i}`); if (el) el.value = ''; }
    for (let i = 1; i <= 8; i++) { const el = document.getElementById(`e${i}`); if (el) el.value = ''; }
    for (let i = 1; i <= 12; i++) { const el = document.getElementById(`c${i}`); if (el) el.value = ''; }
  }

  function updateAutoLessons() {
    const category = getRadioVal('calcCategory');
    if (category !== '방과후') return;

    const is8 = (document.getElementById('boxDetailed8').style.display !== 'none');
    const is12 = (document.getElementById('boxDetailed12').style.display !== 'none');

    let activeLessons = [];

    if (is12) {
      for (let i = 12; i >= 1; i--) {
        const val = Number(document.getElementById(`c${i}`).value) || 0;
        if (val > 0) activeLessons.push(i);
      }
    } else if (is8) {
      for (let i = 8; i >= 1; i--) {
        const val = Number(document.getElementById(`e${i}`).value) || 0;
        if (val > 0) activeLessons.push(i);
      }
    } else {
      for (let i = 4; i >= 1; i--) {
        const val = Number(document.getElementById(`w${i}`).value) || 0;
        if (val > 0) activeLessons.push(i);
      }
    }

    if (activeLessons.length > 0) {
      document.getElementById('displayLessons').value = activeLessons.join(', ');
    }
  }

  function openRecordModal() {
    currentEditId = null;
    document.getElementById('modalTitle').innerText = "정산 내역 등록";
    document.getElementById('btnSaveRecord').innerText = "저장";

    setRadioVal('calcCategory', '방과후');
    document.getElementById('modalMonth').value = document.getElementById('activeMonth').value;
    document.getElementById('rrn').value = '';
    document.getElementById('subject').value = '축구교실';
    document.getElementById('name').value = '';
    document.getElementById('bankName').value = '';
    document.getElementById('bankCode').value = '';
    document.getElementById('accountNumber').value = '';
    document.getElementById('baseRate').value = '26000';
    document.getElementById('material').value = '0';
    document.getElementById('displayLessons').value = '4';
    document.getElementById('note').value = '';
    clearAllCountInputs();

    onChangeCategory();
    document.getElementById('recordModal').style.display = 'flex';
  }

  function openEditRecordModal(id) {
    const records = getRecords();
    const item = records.find(r => r.id === id);
    if (!item) return;

    currentEditId = id;
    document.getElementById('modalTitle').innerText = `[${item.name}] 정산 정보 수정`;
    document.getElementById('btnSaveRecord').innerText = "수정 완료";

    setRadioVal('calcCategory', item.category || '방과후');
    document.getElementById('modalSchool').value = item.school;
    document.getElementById('modalMonth').value = item.month;
    document.getElementById('rrn').value = item.rrn || item.birth || '';
    document.getElementById('subject').value = item.subject || '';
    document.getElementById('name').value = item.name || '';
    document.getElementById('bankName').value = item.bankName || '';
    document.getElementById('bankCode').value = item.bankCode || '';
    document.getElementById('accountNumber').value = item.accountNumber || '';
    document.getElementById('baseRate').value = item.baseRate !== undefined ? item.baseRate : item.grossPay;
    document.getElementById('material').value = item.material || 0;
    document.getElementById('displayLessons').value = item.lessons || '4';
    document.getElementById('note').value = item.note || '';

    clearAllCountInputs();
    if (item.counts) {
      for (const [key, val] of Object.entries(item.counts)) {
        const el = document.getElementById(key);
        if (el) el.value = val;
      }
    }

    onChangeCategory();
    document.getElementById('recordModal').style.display = 'flex';
  }

  function closeRecordModal() {
    currentEditId = null;
    document.getElementById('recordModal').style.display = 'none';
  }

  function onChangeCategory() {
    const category = getRadioVal('calcCategory');
    const currentSchool = document.getElementById('modalSchool').value;
    const currentSubject = document.getElementById('subject').value.trim();

    const box4 = document.getElementById('boxGeneral4');
    const box8 = document.getElementById('boxDetailed8');
    const box12 = document.getElementById('boxDetailed12');
    const rateLabel = document.getElementById('rateLabel');
    const badge = document.getElementById('modeStatusBadge');
    const displayLessons = document.getElementById('displayLessons');
    const lessonsLabel = document.getElementById('lessonsLabel');
    const subjectLabel = document.getElementById('subjectLabel');
    const nameLabel = document.getElementById('nameLabel');

    box4.style.display = 'none';
    box8.style.display = 'none';
    box12.style.display = 'none';

    subjectLabel.innerText = "과목명";
    nameLabel.innerText = "강사명";
    lessonsLabel.innerText = "수업차시(표시용)";

    // [특수 로직] 온동네돌봄센터의 안전관리자/돌봄전담사는 '일급 모드'로 자동 전환
    const isCareCenter = (currentSchool === '온동네돌봄센터');
    const isCareStaff = (category === '안전관리자' || category === '돌봄전담사');

    if (isCareCenter && isCareStaff) {
      rateLabel.innerText = '1일 단가';
      lessonsLabel.innerText = '근무일수(계산반영)';
      subjectLabel.innerText = "역할/업무명";
      nameLabel.innerText = "성명";
      badge.innerText = `● [온동네돌봄센터] ${category} 일급 모드: [일 단가 × 근무일수 + 재료비] 로 자동 정산됩니다.`;
      badge.style.color = '#eb2f96';
      if (!currentEditId && (displayLessons.value === '4' || displayLessons.value === '15' || displayLessons.value === '20')) {
        displayLessons.value = '10';
      }
      if (!document.getElementById('subject').value || document.getElementById('subject').value === '축구교실') {
        document.getElementById('subject').value = category;
      }
      return;
    }

    if (category === '맞춤형') {
      rateLabel.innerText = '시간(차시)당 단가';
      lessonsLabel.innerText = '수업차시(계산반영)';
      badge.innerText = '● 맞춤형프로그램 모드: [단가 × 수업차시 + 재료비] 로 자동 정산됩니다.';
      badge.style.color = '#d46b08';
      if (!currentEditId && displayLessons.value === '4') displayLessons.value = '8';
      return;
    }

    // 일반 학교의 코디 / 안전관리자 / 돌봄전담사는 기존처럼 월 기본급(정액)
    if (category === '코디' || category === '안전관리자' || category === '돌봄전담사') {
      rateLabel.innerText = '월 기본급 (정액)';
      subjectLabel.innerText = "역할/업무명";
      nameLabel.innerText = "성명";
      badge.innerText = `● ${category} 모드: 월 기본급(정액)으로 정산됩니다.`;
      
      if (category === '코디') badge.style.color = '#389e0d';
      else if (category === '안전관리자') badge.style.color = '#722ed1';
      else badge.style.color = '#eb2f96';

      if (!currentEditId) {
        displayLessons.value = (category === '코디') ? '20' : (category === '돌봄전담사' ? '20' : '15');
        if (!document.getElementById('subject').value || document.getElementById('subject').value === '축구교실') {
          document.getElementById('subject').value = category;
        }
      }
      return;
    }

    const settings = getSettings();
    const schoolMap = settings[currentSchool] || {};
    
    let mode = '4';
    for (const key of ['피아노2', '컴퓨터2', '컴퓨터1', '영어2', '피아노', '영어', '수학', '컴퓨터']) {
      if (currentSubject.includes(key)) {
        if (key === '컴퓨터') {
          mode = schoolMap['컴퓨터1'] || '4';
        } else {
          mode = schoolMap[key] || (key === '영어2' || key === '피아노' || key === '피아노2' ? '12' : (key === '컴퓨터2' ? '8' : '4'));
        }
        break;
      }
    }

    if (mode === '8') {
      box8.style.display = 'block';
      rateLabel.innerText = '8회 완강 기준수수료';
      badge.innerText = `● [${currentSchool}] ${currentSubject} → 방과후 8회 세분화 (n/8 회차별 원단위 절사)`;
      badge.style.color = '#fa8c16';
      if (!currentEditId) displayLessons.value = '8';
    } else if (mode === '12') {
      box12.style.display = 'block';
      rateLabel.innerText = '12회 완강 기준수수료';
      badge.innerText = `● [${currentSchool}] ${currentSubject} → 방과후 12회 세분화 (n/12 회차별 원단위 절사)`;
      badge.style.color = '#722ed1';
      if (!currentEditId) displayLessons.value = '12';
    } else {
      box4.style.display = 'block';
      rateLabel.innerText = '4주 완강 기준수수료';
      badge.innerText = `● [${currentSchool}] ${currentSubject} → 방과후 4회 일반 (n/4 회차별 원단위 절사)`;
      badge.style.color = '#1890ff';
      if (!currentEditId) displayLessons.value = '4';
    }

    updateAutoLessons();
  }

  function calcRoundDownRate(baseRate, totalLessons, lessonStep) {
    if (totalLessons === lessonStep) return baseRate;
    return Math.floor(((baseRate / totalLessons) * lessonStep) / 10) * 10;
  }

  function calculateItemTaxes(grossPay) {
    const stdPay = Math.round(grossPay * (1 - 0.193));

    let specialTax = 0;
    if (stdPay < 800000) {
      specialTax = 0;
    } else if (stdPay <= 1330000) {
      specialTax = 10640;
    } else {
      specialTax = Math.floor((stdPay * 0.008) / 10) * 10;
    }

    const indAccTax = Math.floor((stdPay * 0.0033) / 10) * 10;
    const incomeTax = Math.floor((grossPay * 0.03) / 10) * 10;
    const localTax = Math.floor((incomeTax * 0.1) / 10) * 10;
    const netPay = grossPay - (specialTax + indAccTax + incomeTax + localTax);

    return { stdPay, specialTax, indAccTax, incomeTax, localTax, netPay };
  }

  function recalculateAllData(showAlert) {
    let records = getRecords();
    if (records.length === 0) {
      renderTable();
      return;
    }

    records = records.map(item => {
      const taxes = calculateItemTaxes(item.grossPay || 0);
      return {
        ...item,
        stdPay: taxes.stdPay,
        specialTax: taxes.specialTax,
        indAccTax: taxes.indAccTax,
        incomeTax: taxes.incomeTax,
        localTax: taxes.localTax,
        netPay: taxes.netPay
      };
    });

    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    renderTable();

    if (showAlert) {
      alert(`총 ${records.length}명의 급여 내역이 최신 기준(경비율 19.3%, 특고료 구간, 산재 0.33%)으로 일괄 재계산되었습니다!`);
    }
  }

  function saveRecordFromModal() {
    const category = getRadioVal('calcCategory');
    const school = document.getElementById('modalSchool').value;
    const month = document.getElementById('modalMonth').value;
    const rrnInput = document.getElementById('rrn').value.trim();
    const subject = document.getElementById('subject').value;
    const name = document.getElementById('name').value;
    const bankName = document.getElementById('bankName').value.trim();
    const bankCode = document.getElementById('bankCode').value.trim();
    const accountNumber = document.getElementById('accountNumber').value.trim();
    const rateOrSalary = Number(document.getElementById('baseRate').value) || 0;
    const material = Number(document.getElementById('material').value) || 0;
    let displayLessons = document.getElementById('displayLessons').value.trim();
    const note = document.getElementById('note').value;

    if (!name.trim()) return alert('성명/강사명을 입력하세요.');

    const pureRrn = rrnInput.replace(/[^0-9]/g, '');
    const birth = pureRrn.length >= 6 ? pureRrn.slice(0, 6) : rrnInput;

    let grossPay = 0;
    const counts = {};
    const is8 = (document.getElementById('boxDetailed8').style.display !== 'none');
    const is12 = (document.getElementById('boxDetailed12').style.display !== 'none');

    const isCareCenter = (school === '온동네돌봄센터');
    const isCareStaff = (category === '안전관리자' || category === '돌봄전담사');

    // 1. 온동네돌봄센터 일급 계산식
    if (isCareCenter && isCareStaff) {
      const numericDays = Number(displayLessons) || 0;
      grossPay = Math.round(rateOrSalary * numericDays) + material;
    } else if (category === '맞춤형') {
      const numericLessons = Number(displayLessons) || 0;
      grossPay = Math.round(rateOrSalary * numericLessons) + material;
    } else if (category === '코디' || category === '안전관리자' || category === '돌봄전담사') {
      // 일반 학교 정액
      grossPay = rateOrSalary + material;
    } else if (is8) {
      let totalCoursePay = 0;
      for (let i = 1; i <= 8; i++) {
        const count = Number(document.getElementById(`e${i}`).value) || 0;
        if (count > 0) {
          counts[`e${i}`] = count;
          const rateForStep = calcRoundDownRate(rateOrSalary, 8, i);
          totalCoursePay += rateForStep * count;
        }
      }
      grossPay = totalCoursePay + material;
    } else if (is12) {
      let totalCoursePay = 0;
      for (let i = 1; i <= 12; i++) {
        const count = Number(document.getElementById(`c${i}`).value) || 0;
        if (count > 0) {
          counts[`c${i}`] = count;
          const rateForStep = calcRoundDownRate(rateOrSalary, 12, i);
          totalCoursePay += rateForStep * count;
        }
      }
      grossPay = totalCoursePay + material;
    } else {
      const w4 = (Number(document.getElementById('w4').value) || 0);
      const w3 = (Number(document.getElementById('w3').value) || 0);
      const w2 = (Number(document.getElementById('w2').value) || 0);
      const w1 = (Number(document.getElementById('w1').value) || 0);
      
      let totalCoursePay = 0;
      if (w4 > 0) { counts.w4 = w4; totalCoursePay += calcRoundDownRate(rateOrSalary, 4, 4) * w4; }
      if (w3 > 0) { counts.w3 = w3; totalCoursePay += calcRoundDownRate(rateOrSalary, 4, 3) * w3; }
      if (w2 > 0) { counts.w2 = w2; totalCoursePay += calcRoundDownRate(rateOrSalary, 4, 2) * w2; }
      if (w1 > 0) { counts.w1 = w1; totalCoursePay += calcRoundDownRate(rateOrSalary, 4, 1) * w1; }

      grossPay = totalCoursePay + material;
    }

    if (!displayLessons && category === '방과후') {
      const activeSteps = Object.keys(counts).map(k => k.replace(/[^0-9]/g, '')).sort((a,b) => b-a);
      displayLessons = activeSteps.length > 0 ? activeSteps.join(', ') : '4';
    }

    const taxes = calculateItemTaxes(grossPay);
    const records = getRecords();

    const recordData = {
      school, category, month, subject, name, 
      rrn: rrnInput,
      birth: birth,
      bankName, bankCode, accountNumber,
      material, lessons: displayLessons,
      baseRate: rateOrSalary, counts, note,
      grossPay,
      stdPay: taxes.stdPay,
      specialTax: taxes.specialTax,
      indAccTax: taxes.indAccTax,
      incomeTax: taxes.incomeTax,
      localTax: taxes.localTax,
      netPay: taxes.netPay
    };

    if (currentEditId) {
      const idx = records.findIndex(r => r.id === currentEditId);
      if (idx !== -1) {
        records[idx] = { ...records[idx], ...recordData };
      }
      alert(`[${name}] 님의 정보가 수정되었습니다.`);
    } else {
      records.push({ id: Date.now(), ...recordData });
      alert(`[${name}] 님이 등록되었습니다.`);
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    closeRecordModal();
    renderTable();
  }

  function renderTable() {
    const records = getRecords();
    const schoolFilter = document.getElementById('schoolFilter').value;
    const activeMonth = document.getElementById('activeMonth').value;

    let filtered = records.filter(r => {
      const matchSchool = schoolFilter === '전체' || r.school === schoolFilter;
      const matchMonth = r.month === activeMonth;
      const matchSearch = !currentSearchQuery || (r.name && r.name.includes(currentSearchQuery));
      return matchSchool && matchMonth && matchSearch;
    });

    filtered.sort((a, b) => {
      const schoolComp = (a.school || '').localeCompare(b.school || '', 'ko');
      if (schoolComp !== 0) return schoolComp;
      return (a.name || '').localeCompare(b.name || '', 'ko');
    });

    const tbody = document.getElementById('payrollTbody');
    tbody.innerHTML = '';

    let totalGrossSum = 0;
    let totalIncomeTax = 0;
    let totalLocalTax = 0;
    let totalSpecialTax = 0;
    let totalIndAccTax = 0;
    let totalNetSum = 0;

    filtered.forEach(item => {
      totalGrossSum += (item.grossPay || 0);
      totalIncomeTax += (item.incomeTax || 0);
      totalLocalTax += (item.localTax || 0);
      totalSpecialTax += (item.specialTax || 0);
      totalIndAccTax += (item.indAccTax || 0);
      totalNetSum += (item.netPay || 0);

      const cat = item.category || '방과후';
      const bInfo = item.bankName ? `${item.bankName}` : '-';
      const aInfo = item.accountNumber ? `${item.accountNumber}` : '-';

      let rrnMasked = '-';
      const pure = (item.rrn || item.birth || '').replace(/[^0-9]/g, '');
      if (pure.length >= 7) {
        rrnMasked = pure.slice(0, 6) + '-' + pure.slice(6, 7) + '******';
      } else if (pure.length >= 6) {
        rrnMasked = pure.slice(0, 6);
      }

      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="font-weight:600; color:#1f1f1f;">${item.school}</td>
        <td><span class="badge-cat cat-${cat}">${cat}</span></td>
        <td>${item.subject}</td>
        <td><span class="name-link" onclick="openEditRecordModal(${item.id})" title="클릭하여 수정">${item.name}</span></td>
        <td style="font-family:-apple-system, sans-serif; font-size:11.5px;">${rrnMasked}</td>
        <td style="font-size:11.5px; color:#555;">${bInfo}</td>
        <td style="font-size:11.5px; font-family:-apple-system, sans-serif;">${aInfo}</td>
        <td class="money-col">${item.material.toLocaleString()}</td>
        <td>${item.lessons}</td>
        <td class="money-col" style="font-weight:bold;">${item.grossPay.toLocaleString()}</td>
        <td class="money-col">${item.stdPay.toLocaleString()}</td>
        <td class="money-col">${item.specialTax ? item.specialTax.toLocaleString() : '0'}</td>
        <td class="money-col">${item.indAccTax.toLocaleString()}</td>
        <td class="money-col">${item.incomeTax.toLocaleString()}</td>
        <td class="money-col">${item.localTax.toLocaleString()}</td>
        <td class="money-col highlight-blue">${item.netPay.toLocaleString()}</td>
        <td>
          <button class="btn-del" onclick="deleteItem(${item.id})">삭제</button>
        </td>
      `;
      tbody.appendChild(row);
    });

    const searchNotice = currentSearchQuery ? ` [검색: "${currentSearchQuery}"]` : '';
    document.getElementById('summaryCounter').innerHTML = `
      <span>전체 ${filtered.length}건${searchNotice}</span>
      <span class="divider">|</span>
      <span>총 지급계 <strong class="total-gross">₩${totalGrossSum.toLocaleString()}</strong></span>
      <span class="divider">|</span>
      <span>소득세계 <strong class="total-tax">₩${totalIncomeTax.toLocaleString()}</strong></span>
      <span class="divider">|</span>
      <span>주민세계 <strong class="total-tax">₩${totalLocalTax.toLocaleString()}</strong></span>
      <span class="divider">|</span>
      <span>특고료계 <strong class="total-tax">₩${totalSpecialTax.toLocaleString()}</strong></span>
      <span class="divider">|</span>
      <span>산재보험계 <strong class="total-tax">₩${totalIndAccTax.toLocaleString()}</strong></span>
      <span class="divider">|</span>
      <span>총 실지급액 <strong class="total-net">₩${totalNetSum.toLocaleString()}</strong></span>
    `;
  }

  function exportTaxCombinedCSV() {
    const records = getRecords();
    const activeMonth = document.getElementById('activeMonth').value;

    const monthRecords = records.filter(r => r.month === activeMonth);
    if (monthRecords.length === 0) return alert(`${activeMonth} 월에 등록된 데이터가 없습니다.`);

    const grouped = {};
    monthRecords.forEach(r => {
      const pureRrn = (r.rrn || r.birth || '').replace(/[^0-9]/g, '');
      const key = `${r.name.trim()}_${pureRrn.slice(0, 6)}`;

      if (!grouped[key]) {
        grouped[key] = {
          name: r.name.trim(),
          rrn: r.rrn || r.birth || '',
          bankName: r.bankName || '',
          bankCode: r.bankCode || '',
          accountNumber: r.accountNumber || '',
          schools: [],
          categories: [],
          subjects: [],
          totalGross: 0,
          totalMaterial: 0
        };
      }
      if (!grouped[key].rrn && r.rrn) grouped[key].rrn = r.rrn;
      if (!grouped[key].bankName && r.bankName) grouped[key].bankName = r.bankName;
      if (!grouped[key].bankCode && r.bankCode) grouped[key].bankCode = r.bankCode;
      if (!grouped[key].accountNumber && r.accountNumber) grouped[key].accountNumber = r.accountNumber;

      if (!grouped[key].schools.includes(r.school)) grouped[key].schools.push(r.school);
      if (!grouped[key].categories.includes(r.category || '방과후')) grouped[key].categories.push(r.category || '방과후');
      if (!grouped[key].subjects.includes(r.subject)) grouped[key].subjects.push(r.subject);

      grouped[key].totalGross += (r.grossPay || 0);
      grouped[key].totalMaterial += (r.material || 0);
    });

    const list = Object.values(grouped).sort((a, b) => a.name.localeCompare(b.name, 'ko'));

    let csv = '\uFEFF귀속연월,강사명,주민등록번호(13자리),은행명,은행코드,계좌번호,근무학교목록,구분,과목명,총지급액(세전),재료비(비과세),과세대상소득,경비율공제후(80.7%),특고고용보험,산재보험료,사업소득세(3%),지방소득세(0.3%),총공제세액,차인지급액(실수령액)\n';

    list.forEach(g => {
      const gross = g.totalGross;
      const mat = g.totalMaterial;
      const taxable = gross;

      const taxes = calculateItemTaxes(gross);
      const totalDeduct = taxes.specialTax + taxes.indAccTax + taxes.incomeTax + taxes.localTax;

      const schoolStr = `"${g.schools.join(', ')}"`;
      const catStr = `"${g.categories.join(', ')}"`;
      const subjStr = `"${g.subjects.join(', ')}"`;
      const rrnStr = g.rrn ? `\t${g.rrn}` : '';
      const accStr = g.accountNumber ? `\t${g.accountNumber}` : '';

      csv += `${activeMonth},${g.name},${rrnStr},${g.bankName},${g.bankCode},${accStr},${schoolStr},${catStr},${subjStr},${gross},${mat},${taxable},${taxes.stdPay},${taxes.specialTax},${taxes.indAccTax},${taxes.incomeTax},${taxes.localTax},${totalDeduct},${taxes.netPay}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `세무신고용_강사별합산급여대장_${activeMonth}.csv`;
    link.click();

    alert(
      `✅ [세무신고용 강사별 합산 CSV]가 다운로드되었습니다!\n\n` +
      `총 ${list.length}명의 강사 주민번호 13자리 전체 및 계좌정보가 포함되어 원천세 신고 자료로 바로 활용하실 수 있습니다.`
    );
  }

  function exportDataJs() {
    const records = getRecords();
    if (records.length === 0) return alert('등록된 정산 내역이 없습니다.');

    const exportList = [...records].sort((a, b) => {
      const sComp = (a.school || '').localeCompare(b.school || '', 'ko');
      if (sComp !== 0) return sComp;
      return (a.name || '').localeCompare(b.name || '', 'ko');
    }).map(r => {
      const rawId = (r.rrn || r.birth || '').replace(/[^0-9]/g, '');
      const safeBirth = rawId.length >= 6 ? rawId.slice(0, 6) : rawId;

      return {
        school: r.school,
        category: r.category || '방과후',
        month: r.month,
        subject: r.subject,
        name: r.name.trim(),
        birth: safeBirth,
        bankName: r.bankName || '',
        accountNumber: r.accountNumber || '',
        material: r.material,
        lessons: r.lessons,
        baseRate: r.baseRate || 0,
        counts: r.counts || {},
        grossPay: r.grossPay,
        stdPay: r.stdPay,
        specialTax: r.specialTax,
        indAccTax: r.indAccTax,
        incomeTax: r.incomeTax,
        localTax: r.localTax,
        netPay: r.netPay
      };
    });

    const fileContent = "window.PAYROLL_PUBLIC_DATA = " + JSON.stringify(exportList, null, 2) + ";";
    const blob = new Blob([fileContent], { type: "application/javascript;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "data.js";
    link.click();

    alert(
      "✅ [data.js] 파일이 다운로드되었습니다!\n\n" +
      "강사님 조회용 파일이므로 주민번호 뒷자리는 자동으로 안전하게 제외되고\n" +
      "생년월일(앞 6자리)만 저장되었습니다.\n\n" +
      "GitHub 저장소에 덮어쓰기 업로드해 주세요."
    );
  }

  function deleteItem(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    let records = getRecords();
    records = records.filter(r => r.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    renderTable();
  }

  function exportCSV() {
    const records = getRecords();
    const sorted = [...records].sort((a, b) => {
      const sComp = (a.school || '').localeCompare(b.school || '', 'ko');
      if (sComp !== 0) return sComp;
      return (a.name || '').localeCompare(b.name || '', 'ko');
    });

    let csv = '\uFEFF근무처,구분,과목명,성명,주민등록번호,은행명,은행코드,계좌번호,재료비,수업차시(일수),지급계,경비율제외,특고료,산재보험료,소득세,주민세,실지급액\n';
    sorted.forEach(r => {
      const rrnStr = (r.rrn || r.birth) ? `\t${r.rrn || r.birth}` : '';
      const accStr = r.accountNumber ? `\t${r.accountNumber}` : '';
      csv += `${r.school},${r.category || '방과후'},${r.subject},${r.name},${rrnStr},${r.bankName || ''},${r.bankCode || ''},${accStr},${r.material},${r.lessons},${r.grossPay},${r.stdPay},${r.specialTax},${r.indAccTax},${r.incomeTax},${r.localTax},${r.netPay}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `학교별_급여지급대장_${document.getElementById('activeMonth').value}.csv`;
    link.click();
  }
</script>
